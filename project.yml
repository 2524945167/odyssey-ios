name: Odyssey
options:
  bundleIdPrefix: com.kupetis
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    # No App Intents/Siri/Shortcuts in this target. Restore extraction if they are added.
    # Skip the unused task, not its warnings (LM_FILTER_WARNINGS remains disabled).
    LM_SKIP_METADATA_EXTRACTION: "YES"
configs:
  Debug: debug
  Release: release
targets:
  Odyssey:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
      - path: Features
      - path: Core
      - path: Services
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Odyssey
        PRODUCT_BUNDLE_IDENTIFIER: com.kupetis.odyssey
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  OdysseyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests
    dependencies:
      - target: Odyssey
    settings:
      base:
        PRODUCT_NAME: OdysseyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.kupetis.odysseyTests
        INFOPLIST_FILE: Tests/Info.plist
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Odyssey:
    build:
      targets:
        Odyssey: all
        OdysseyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OdysseyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
